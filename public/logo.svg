<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- ALS Infonet Rare Emblem: The Tri-Vector Nexus & Topological Interlocking Circuit -->
  
  <!-- Outer Protective High-Contrast Silhouette for red/dark surfaces -->
  <path
    d="M 50,4 L 56,12 L 68,26 L 73,43 L 88,71 L 81,77 L 60,77 L 44,77 L 16,77 L 11,71 L 26,43 L 31,26 L 43,12 Z"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="none"
  />

  <g transform="translate(50, 52)">
    <!-- Blade 1: Top Ascender (0 deg) -->
    <g transform="rotate(0)">
      <path d="M 0,-42 L 18,-22 L 23,-4 L 14,12 L 2,7 L 0,-11 Z" fill="#0A0A0A" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-42 L -12,-22 L -4,-6 L 0,-11 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-35 L 0,-16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Blade 2: Bottom-Right Anchor (120 deg) -->
    <g transform="rotate(120)">
      <path d="M 0,-42 L 18,-22 L 23,-4 L 14,12 L 2,7 L 0,-11 Z" fill="#0A0A0A" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-42 L -12,-22 L -4,-6 L 0,-11 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-35 L 0,-16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Blade 3: Bottom-Left Loop (240 deg) -->
    <g transform="rotate(240)">
      <path d="M 0,-42 L 18,-22 L 23,-4 L 14,12 L 2,7 L 0,-11 Z" fill="#0A0A0A" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-42 L -12,-22 L -4,-6 L 0,-11 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-35 L 0,-16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Interlocking Overpass Cap: Blade 1 over Blade 3 -->
    <g transform="rotate(0)">
      <path d="M 0,-42 L -12,-22 L -4,-6 L 0,-11 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M 0,-35 L 0,-20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Central Aperture Delta -->
    <polygon points="0,-11 9.53,5.5 -9.53,5.5" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Central Floating Diamond Core -->
    <path d="M 0,-6 L 4.5,0 L 0,6 L -4.5,0 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1" />

    <!-- Central Pulse Node (Crimson Core) -->
    <circle cx="0" cy="0" r="1.8" fill="#E50914" />
  </g>
</svg>
